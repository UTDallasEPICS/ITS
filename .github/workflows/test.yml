name: CI

# Runs lint, type-check, and the Vitest suite on every pull request and on
# pushes to the deploy branches. Deploys themselves live in deploy.yml; this is
# the correctness gate.
on:
  pull_request:
  push:
    branches:
      - dev
      - stage
      - prod

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
